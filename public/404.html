<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ian Rebuffo — Portfolio</title>
    <script>
      // Single Page Apps for GitHub Pages (/ian-portfolio/)
      // Redirects deep links like /ian-portfolio/work/tay to /ian-portfolio/?/work/tay
      var pathSegmentsToKeep = window.location.pathname.indexOf("/ian-portfolio") === 0 ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
